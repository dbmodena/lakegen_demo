# Free-form experiment identifier. It is stored in manifests and logs so runs
# can be distinguished and reproduced. It must not be empty.
experiment_id: uk-pneuma

# Experiment seed (integer >= 0), recorded to make runs comparable.
seed: 0

# Solr core, i.e. the dataset portal to query.
# Supported alternatives: nyc | uk
core: uk

# LLM used during discovery, code generation, and answer generation.
# Supported alternatives:
#   - openai.gpt-oss-120b
#   - meta.llama-3.3-70b-instruct
model: openai.gpt-oss-120b

# Table discovery architecture:
#   - unified: one agent generates keywords and selects tables
#   - divided: separates keyword generation from table search and selection
discovery_architecture: unified

# How the agent accesses tools:
#   - agentic: the agent invokes tools directly
#   - orchestrated_context: the orchestrator would prepare the context
# agentic lets discovery agents call their tools directly;
# orchestrated_context performs retrieval first and gives the discovery agent
# a stable, tool-free JSON context.
tool_access: agentic
# Keep false for the tool-free orchestrated baseline. Enable it only to test
# persistent query/zero-result feedback managed by the orchestrator.
orchestrated_memory_enabled: false

# Discovery/selection bounds. Keep these values explicit so experiment reports
# do not depend on defaults hidden in the Python configuration model.
discovery:
  initial_candidates: 10
  expansion_size: 5
  max_expansions: 1
  max_search_attempts: 1
  max_zero_result_retries: 2
  initial_shortlist_size: 10
  max_inspected_candidates: 10
  max_inspections_per_file: 2
  search_after_inspection: false

retrieval:
  # Strategy used to retrieve candidate tables:
  #   - keyword: lexical BM25 search using keywords generated by the agent
  #   - semantic: vector KNN search using the complete question
  #   - hybrid: combines BM25 and KNN results
  #   - pneuma: original Pneuma index and ranking (optional environment)
  #   - pneuma_seeker: pneuma + content search + table enumeration
  #   - duckdb_agentic: bounded DuckDB SQL over local Parquet schemas, metadata,
  #     and sampled cell values. Good structured, index-free baseline.
  mode: pneuma

  # Ranked retrieval pool size. The selector initially sees 10 and can reveal
  # the rest adaptively in blocks of 5. Must be > 0.
  top_k: 20

  # Weight of the lexical component in hybrid fusion, from 0.0 to 1.0:
  #   1.0 = BM25 only; 0.0 = semantic search only; 0.5 = equal weights.
  # It does not affect keyword/semantic modes and RRF ignores it.
  alpha: 0.25

  # In hybrid mode, each branch retrieves top_k * candidate_multiplier results
  # before fusion. Larger values increase coverage, cost, and latency.
  # Must be an integer > 0 (with these values: 10 * 5 = 50 per branch).
  candidate_multiplier: 5

  # Version of the indexed representation. Semantic search filters documents by
  # this value, which must match the value used during indexing.
  representation_version: metadata-v1

  # Embedding model used for semantic/hybrid queries. It must match the model
  # used to generate the vectors stored in the Solr core.
  embedding_model: cohere.embed-v4.0

  # Used only for Ollama models; OCI uses the existing OCI credentials/endpoint.
  embedding_base_url: http://localhost:11434

  # Name of the Solr DenseVectorField that stores table embeddings.
  vector_field: table_embedding

  # BM25 fields and boosts in Solr "qf" format, for example:
  # "title^3 description^2 columns". null uses the client's default fields.
  lexical_query_fields: null

  # How hybrid fusion handles a document missing from one of the two branches:
  #   - zero: assigns zero to the missing signal (default and operational)
  #   - rescore: recomputes the missing signal; requires a reliable Solr resolver
  #     [usable only when the integration provides such a resolver]
  missing_signal_policy: zero

  # Result fusion method used in hybrid mode:
  #   - weighted: normalizes scores and applies the alpha weight
  #   - rrf: Reciprocal Rank Fusion; combines ranks and ignores alpha
  fusion_method: weighted

  # Reciprocal Rank Fusion smoothing constant: score = 1 / (rrf_k + rank).
  # It applies only when fusion_method is rrf and must be an integer > 0.
  rrf_k: 60

  # Original Pneuma backend settings. They are used only with mode: pneuma.
  # The independent service must already contain a generated Pneuma index.
  # NYC and UK are routed automatically to their dedicated Pneuma services.
  # These values remain the fallback for other portals.
  pneuma_index_name: lakegen
  pneuma_base_url: http://localhost:8765
  pneuma_timeout_seconds: 120

  # Pneuma-Seeker only (mode: pneuma_seeker). Weight of the content-search
  # branch against Pneuma's own ranking: 0.0 reproduces plain pneuma ordering,
  # 1.0 ranks purely by cell/column matches. `alpha` above cannot serve here --
  # it is forwarded to Pneuma's own internal hybrid search.
  pneuma_content_weight: 0.5
  # How the content search scores one entity in one table, before the
  # log(1 + raw) damping: raw = table_name_weight x a match in the table's
  # catalog title + column_name_weight x matching column names + cell_weight x
  # matching cells. 3.0 / 2.0 / 1.0 are upstream Pneuma-Seeker's weights. A
  # weight of 0 skips that work; all three 0 is rejected.
  pneuma_table_name_weight: 3.0
  pneuma_column_name_weight: 2.0
  pneuma_cell_weight: 1.0

  # Pull in tables whose identifiers form a family with a retrieved table, e.g.
  # water_body_testing_2020 -> water_body_testing_\d{4}. Set false to reproduce
  # the paper's "Pneuma + content search" ablation arm.
  pneuma_enumerate_tables: true

  # The content scan uses scan_workers and reads every row and column.

  # Worker processes for Pneuma-Seeker content search. Every Polars query runs
  # in these workers, so a native
  # polars crash costs a retried batch instead of the application. The speedup
  # saturates around 16 on a 32-core host.
  scan_workers: 8

  # Controlled local Parquet search settings (mode: duckdb_agentic). The agent
  # proposes/refines concepts; generated DuckDB queries return matches, counts,
  # and bounded samples. No model-generated SQL is executed.
  duckdb_max_files: 250
  duckdb_max_columns_per_file: 40
  duckdb_sample_rows: 3
  duckdb_max_scan_rows_per_file: 100000
  # After global footer ranking, cheaply probe this many following files for
  # terms that occur only in values. Higher values improve recall at the cost
  # of extra I/O and latency; each probe remains row- and column-bounded.
  duckdb_probe_files: 25
  duckdb_probe_rows_per_file: 1000

  # Optional cap for Pneuma-Seeker local content scan. Unset means the whole lake.
  # grep_max_files: 250

benchmark:
  # Questions and gold tables for the retriever-only benchmark, run with
  # `python -m lakegen.retrieval.benchmark --config <this file>`. Either a
  # curated case file (benchmark/50q_uk.json) or a generated-queries file
  # (generated_queries_semantic.json), whose successful queries all become
  # cases. The interactive and batch workflows ignore it. null = no default.
  path: benchmark/50q_uk.json

# Automatic reviewers for the different phases. Every field is boolean, but
# only false is currently supported; validation rejects any enabled reviewer.
reviewers:
  dataset: false # Reviews the selected tables.
  plan: false    # Reviews the execution plan.
  code: false    # Reviews the generated code.
  result: false  # Reviews the final result.

# Maximum number of revision cycles. Must be an integer >= 0; the current
# workflow supports only 3 and rejects any other value.
max_revision_rounds: 3

# Amount of context provided to the coder:
#   - full: schemas and sample rows
#   - schema_only: schemas only
#   - minimal: load commands only
coder_context_level: full

# Run full, schema_only, and minimal against one shared retrieval/selection.
automatic_test_coder: true

# Block Phase 3 until discovery supplies a complete plan verified exclusively
# against runtime schemas and profiles. Set false only for legacy ablations.
require_semantic_plan: true

# Judge executable gold mismatches with one fixed model for comparable runs.
semantic_code_judge_enabled: true
semantic_code_judge_model: openai.gpt-oss-120b

# Human interaction policy:
#   - human_gated: the CLI/UI requests confirmations and hints at enabled gates
#   - autonomous: runs without prompts; also used by batches and the API
interaction_mode: autonomous

# Interactive workflow gates. These matter in human_gated mode.
# The schema accepts booleans, but currently supports only this fixed setup:
# keywords and datasets must be true; plan and result must be false.
gates:
  keywords: true # Confirms keywords before search (divided architecture).
  datasets: true # Confirms selected tables before code generation.
  plan: false    # Execution-plan gate [NOT IMPLEMENTED YET].
  result: false  # Final-result gate [NOT IMPLEMENTED YET].
