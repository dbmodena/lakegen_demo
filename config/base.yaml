# The base experiment configuration: every setting, with its accepted values.
#
# Every setting is explicit here, so a report never depends on a default hidden
# in the code. An experiment file names this one in `extends:` and overrides
# what it changes, usually by adding presets from config/presets/:
#
#     schema_version: 2
#     extends: [base.yaml, presets/retrieval/hybrid_rrf.yaml, presets/model/together_gpt_oss_120b.yaml]
#     experiment_id: bench-chicago-hybrid
#     lake: chicago
#
# Every config file starts with `schema_version: 2`. `lakegen config show <file>`
# prints the resolved configuration.

schema_version: 2

# Free-form identifier stored in manifests and logs, so runs can be told apart.
experiment_id: default

# Seed recorded for reproducibility (integer >= 0).
seed: 0

# The lake to query: a name from config/lakes.yaml.
lake: nyc

# The LLM of discovery, code generation and answer synthesis: a name from
# config/models.yaml.
model: openai.gpt-oss-120b

discovery:
  # divided: a keyword writer, then the table selector over what retrieval found;
  # unified: one agent that searches the catalogue itself and selects from what
  # it finds (the selector with a search tool).
  architecture: divided
  # Who selects tables in the divided architecture: memgpt, an agent with a
  # system-kept working memory. llm (the judge memgpt replaced) and jev
  # (TypeSafe's decision model, removed) only appear in the configurations of
  # past runs.
  selector:
    kind: memgpt
  budget:
    max_zero_result_retries: 2  # the divided writer's new keywords after a strict-AND search (hybrid: its keyword side) matched nothing

retrieval:
  # keyword | semantic | hybrid | pneuma | pneuma_seeker | duckdb_agentic |
  # hybrid_duckdb_semantic. A block below is accepted only for the modes that
  # read it: hybrid for hybrid and hybrid_duckdb_semantic; rerank for keyword,
  # semantic, hybrid and hybrid_duckdb_semantic; pneuma for pneuma and
  # pneuma_seeker; seeker for pneuma_seeker; duckdb for duckdb_agentic and
  # hybrid_duckdb_semantic.
  mode: hybrid
  top_k: 20                  # ranked pool size; the selector sees initial_candidates of it
  candidate_multiplier: 5    # per-branch pool as a multiple of top_k (hybrid, seeker)
  representation_version: metadata-v1
  embedding_model: cohere.embed-v4.0
  embedding_base_url: http://localhost:11434   # Ollama embedding models only
  vector_field: table_embedding
  lexical_query_fields: null                   # BM25 qf, e.g. "title^3 description^2 columns"
  keyword_or_fallback: false
  hybrid:
    fusion: weighted         # weighted (uses alpha) or rrf (uses rrf_k)
    alpha: 0.25              # lexical weight; the DuckDB weight in hybrid_duckdb_semantic
    rrf_k: 60
    missing_signal: zero
  rerank:
    model: cohere.rerank-v4.0-fast   # null turns reranking off
    depth: 20

coding:
  context_level: full        # full | schema_only | minimal
  brief_mode: advisory       # advisory | strict
  automatic_test_coder: true # run full, schema_only and minimal on one selection
  require_semantic_plan: true
  revision_mode: current     # current | no_semantic_revision (ablation)
  max_revision_rounds: 3

judge:
  enabled: true
  model: openai.gpt-oss-120b

interaction:
  mode: autonomous           # autonomous (API, batches) | human_gated (CLI, UI)
  gates:
    keywords: true
    datasets: true
    plan: false              # not implemented
    result: false            # not implemented

# Automatic reviewers are not implemented; every value must stay false.
reviewers:
  dataset: false
  plan: false
  code: false
  result: false

benchmark:
  path: null                 # the retriever-only benchmark's question file
