# The lakes LakeGen can query, in the order the interfaces list them.
#
# A lake's name is its Solr core (LAKEGEN_SOLR_CORE_<LAKE> can point it at a
# differently named core), its folder under data/ and its blend database
# data/blend_<lake>.db. Paths are relative to the repository root.
#
# pneuma: one Pneuma service per lake, each holding one index folder, the ones
# config/services.yaml starts: NYC on 8774 and UK on 8767 (8765 and 8766 were
# another user's servers), the portals rebuilt in September 2026 on 8771-8773
# and the benchmark lakes on 8781-8783. LAKEGEN_PNEUMA_<LAKE>_BASE_URL and
# LAKEGEN_PNEUMA_<LAKE>_INDEX_NAME override a route.

defaults:
  dataset_roots: [datasets]              # searched in this order under data/<lake>/
  table_dirs: [parquets, parquet, csv]   # the first one holding table files wins
  metadata_files: [metadata_retrieved_only.json, metadata.json]
  statistics_file: datasets_metadata.csv
  pneuma_index: lakegen-cohere-v4-1024

lakes:
  nyc:
    title: New York City Open Data portal
    starters: benchmark/100q_nyc.json
    pneuma_url: http://localhost:8774
  valencia:
    title: Valencia Open Data portal
    starters: benchmark/100q_valencia.json
    pneuma_url: http://localhost:8771
  bologna:
    title: Bologna Open Data portal
    starters: benchmark/100q_bologna.json
    pneuma_url: http://localhost:8773
  paris:
    title: Paris Open Data portal
    starters: benchmark/100q_paris.json
    pneuma_url: http://localhost:8772
  uk:
    title: UK Open Data portal
    starters: benchmark/100q_uk.json
    reference_questions: benchmark/100q_uk.json
    pneuma_url: http://localhost:8767
    # The cleaned tables and metadata are preferred when they exist.
    dataset_roots: [clean_datasets, datasets]
    metadata_files: [metadata_retrieved_cleaned.json, metadata_retrieved_only.json, metadata.json]
  kramabench:
    title: KramaBench data lake (archaeology, astronomy, biomedical, environment, legal, wildfire)
    starters: benchmark/100q_kramabench.json
    pneuma_url: http://localhost:8781
  target_bird:
    title: BIRD databases (TARGET benchmark)
    starters: benchmark/100q_target_bird.json
    pneuma_url: http://localhost:8782
  chicago:
    title: City of Chicago Open Data portal
    starters: benchmark/100q_chicago.json
    pneuma_url: http://localhost:8783
