[project]
name = "lakegen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bitarray>=3.8.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.1",
    "jinja2>=3.1.6",
    "llama-index>=0.14.19",
    "llama-index-llms-openai-like>=0.7.1",
    "nltk>=3.9.4",
    "pandas>=2.3.3",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "thefuzz>=0.22.1",
    "timeout-decorator>=0.5.0",
    "chainlit>=2.11,<3",
    "valentine>=1.0.0",
    "nest-asyncio>=1.6.0",
    "llama-index-embeddings-ollama>=0.9.0",
    # Temporarily disabled: it pulls in the GPU-enabled PyTorch/CUDA stack.
    # Re-enable together with LAKEGEN_ENABLE_TABPFN=1 when TabPFN is needed.
    # "tabpfn>=8.0.8",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "oci>=2.184.0",
    "llama-index-llms-oci-genai>=0.7.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The package is the lakegen tree under src/; the entry scripts next to it
# (api.py, cli.py, app.py) are run by path.
[tool.setuptools.packages.find]
where = ["src"]
include = ["lakegen*"]

[tool.setuptools.package-data]
lakegen = ["prompts/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "import-linter>=2.3",
    "pytest-cov>=6",
]

# The quality bar of the refactor (docs/REFACTOR_PLAN.md). The gate applies
# it to the Python files a commit touches, not to untouched legacy code.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["experiments", "analysis", "scripts_pneuma", "backups"]

[tool.ruff.lint]
select = ["F", "I", "B", "UP", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["lakegen", "golden", "src", "prompts"]

[tool.ruff.lint.per-file-ignores]
# The entry scripts put src/ on sys.path before importing the package.
"src/api.py" = ["E402", "I001"]
"src/app.py" = ["E402", "I001"]
"src/cli.py" = ["E402", "I001"]
"index_retrieval.py" = ["E402", "I001"]
