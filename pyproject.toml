[project]
name = "lakegen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bitarray>=3.8.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.1",
    "jinja2>=3.1.6",
    "llama-index>=0.14.19",
    "llama-index-llms-openai-like>=0.7.1",
    "nltk>=3.9.4",
    "pandas>=2.3.3",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "thefuzz>=0.22.1",
    "timeout-decorator>=0.5.0",
    "chainlit>=2.11,<3",
    "valentine>=1.0.0",
    "nest-asyncio>=1.6.0",
    "llama-index-embeddings-ollama>=0.9.0",
    # Temporarily disabled: it pulls in the GPU-enabled PyTorch/CUDA stack.
    # Re-enable together with LAKEGEN_ENABLE_TABPFN=1 when TabPFN is needed.
    # "tabpfn>=8.0.8",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "oci>=2.184.0",
    "llama-index-llms-oci-genai>=0.7.0",
]

[project.scripts]
lakegen = "lakegen.interfaces.cli.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The package is the lakegen tree under src/; the entry scripts next to it
# (api.py, cli.py, app.py) are run by path.
[tool.setuptools.packages.find]
where = ["src"]
include = ["lakegen*"]

[tool.setuptools.package-data]
lakegen = ["prompts/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "import-linter>=2.3",
    "pytest-cov>=6",
]

# The quality bar of the refactor (docs/REFACTOR_PLAN.md). The gate applies
# it to the Python files a commit touches, not to untouched legacy code.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["experiments", "analysis", "scripts_pneuma", "backups"]

[tool.ruff.lint]
select = ["F", "I", "B", "UP", "C901", "PLR0915", "TID251"]

# Only the settings registry reads the environment; everything else reads it
# through lakegen.config.settings, which names every variable once.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "read the environment through lakegen.config.settings"
"os.getenv".msg = "read the environment through lakegen.config.settings"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["lakegen", "golden", "src", "prompts"]

[tool.ruff.lint.per-file-ignores]
# The entry scripts put src/ on sys.path before importing the package.
"src/api.py" = ["E402", "I001"]
"src/app.py" = ["E402", "I001"]
"src/cli.py" = ["E402", "I001"]
"index_retrieval.py" = ["E402", "I001"]
# The registry itself, and the three places that build a subprocess's or a
# library's environment from the process's own.
"src/lakegen/config/settings.py" = ["TID251"]
"src/lakegen/config/bootstrap.py" = ["TID251"]
"src/lakegen/integrations/pneuma/cell_scan.py" = ["TID251"]
"src/lakegen/experiments/services.py" = ["TID251"]

# The dependency rules between the packages (docs/REFACTOR_PLAN.md), checked by
# `lint-imports` in scripts/check.sh. One import is tolerated until its code
# moves: the experiment config reads the retrieval config (which belongs under
# lakegen.config).
[tool.importlinter]
root_package = "lakegen"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the interfaces import the web and UI frameworks"
type = "forbidden"
source_modules = [
    "lakegen.pipeline", "lakegen.discovery", "lakegen.coding", "lakegen.answer",
    "lakegen.evaluation", "lakegen.tools", "lakegen.retrieval", "lakegen.integrations", "lakegen.config", "lakegen.domain",
    "lakegen.observability", "lakegen.experiments", "lakegen.analysis", "lakegen.prompts",
    "lakegen.interfaces.cli",
]
forbidden_modules = ["chainlit", "fastapi"]

[[tool.importlinter.contracts]]
name = "The packages depend downwards only"
type = "layers"
layers = [
    "lakegen.interfaces",
    "lakegen.experiments",
    "lakegen.pipeline",
    "lakegen.coding",
    "lakegen.discovery",
    "lakegen.answer",
    "lakegen.evaluation",
    "lakegen.tools",
    "lakegen.retrieval",
    "lakegen.integrations",
    "lakegen.config",
    "lakegen.domain",
]

[[tool.importlinter.contracts]]
name = "observability is imported by the pipeline and what runs it only"
type = "forbidden"
source_modules = [
    "lakegen.discovery", "lakegen.coding", "lakegen.answer", "lakegen.evaluation", "lakegen.tools", "lakegen.retrieval", "lakegen.integrations", "lakegen.config", "lakegen.domain", "lakegen.analysis",
]
forbidden_modules = ["lakegen.observability"]

[[tool.importlinter.contracts]]
name = "The lower layers never import the pipeline, the experiments or the interfaces"
type = "forbidden"
source_modules = [
    "lakegen.discovery", "lakegen.coding", "lakegen.answer", "lakegen.evaluation", "lakegen.tools", "lakegen.retrieval", "lakegen.integrations", "lakegen.config", "lakegen.domain", "lakegen.observability",
]
forbidden_modules = [
    "lakegen.pipeline", "lakegen.interfaces", "lakegen.experiments", "lakegen.analysis",
]
