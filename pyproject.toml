[project]
name = "lakegen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bitarray>=3.8.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.1",
    "jinja2>=3.1.6",
    "llama-index>=0.14.19",
    "llama-index-llms-openai-like>=0.7.1",
    "nltk>=3.9.4",
    "pandas>=2.3.3",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "thefuzz>=0.22.1",
    "timeout-decorator>=0.5.0",
    "chainlit>=2.11,<3",
    "valentine>=0.4.1",
    "nest-asyncio>=1.6.0",
    "blend",
    "llama-index-embeddings-ollama>=0.9.0",
    # Temporarily disabled: it pulls in the GPU-enabled PyTorch/CUDA stack.
    # Re-enable together with LAKEGEN_ENABLE_TABPFN=1 when TabPFN is needed.
    # "tabpfn>=8.0.8",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "oci>=2.184.0",
    "llama-index-llms-oci-genai>=0.7.0",
]

[tool.uv.sources]
blend = { git = "https://github.com/nanni00/Blend" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
