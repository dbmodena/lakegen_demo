# jev_selection_rate/uk.yaml, converted to the nested layout on 2026-10-29.
# Dropped as unused by its retrieval mode: retrieval.duckdb_max_columns_per_file, retrieval.duckdb_max_files, retrieval.duckdb_max_scan_rows_per_file, retrieval.duckdb_probe_files, retrieval.duckdb_probe_rows_per_file, retrieval.duckdb_sample_rows, retrieval.pneuma_base_url, retrieval.pneuma_cell_weight, retrieval.pneuma_column_name_weight, retrieval.pneuma_content_fusion, retrieval.pneuma_content_weight, retrieval.pneuma_entity_model, retrieval.pneuma_enumerate_tables, retrieval.pneuma_index_name, retrieval.pneuma_table_name_weight, retrieval.pneuma_timeout_seconds, retrieval.scan_workers.
schema_version: 2
coding:
  automatic_test_coder: true
  context_level: full
  max_revision_rounds: 3
  require_semantic_plan: true
benchmark:
  path: benchmark/100q_uk.json
lake: uk
discovery:
  context:
    compact_history: true
    state_board: true
  budget:
    expansion_size: 5
    initial_candidates: 10
    initial_shortlist_size: 5
    max_expansions: 1
    max_inspected_candidates: 8
    max_inspections_per_file: 2
    max_search_attempts: 1
    max_zero_result_retries: 2
    search_after_inspection: false
  keyword_cascade_size: 5
  keyword_search:
    strategy: cascade
  architecture: unified
experiment_id: jevrate-uk-retrieval
interaction:
  gates:
    datasets: true
    keywords: true
    plan: false
    result: false
  mode: autonomous
model: openai.gpt-oss-120b
retrieval:
  hybrid:
    alpha: 0.25
    fusion: rrf
    missing_signal: zero
    rrf_k: 60
  candidate_multiplier: 5
  embedding_base_url: http://localhost:11434
  embedding_model: cohere.embed-v4.0
  lexical_query_fields: null
  mode: hybrid
  representation_version: metadata-v1
  rerank:
    depth: 20
    model: cohere.rerank-v4.0-fast
  top_k: 20
  vector_field: table_embedding
reviewers:
  code: false
  dataset: false
  plan: false
  result: false
seed: 0
judge:
  enabled: true
  model: openai.gpt-oss-120b
